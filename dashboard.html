<!DOCTYPE html>
<html>
<head>
    <title>KeyAuth Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; min-height: 100vh; padding: 20px; }
        .navbar { background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 20px 40px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8em; }
        .navbar a { color: #667eea; text-decoration: none; cursor: pointer; transition: color 0.3s ease; }
        .navbar a:hover { color: #764ba2; }
        .container { max-width: 1200px; margin: 0 auto; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 20px; backdrop-filter: blur(10px); text-align: center; }
        .stat-card h3 { color: #aaa; font-size: 0.9em; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .number { font-size: 2.5em; font-weight: bold; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 30px; backdrop-filter: blur(10px); margin-bottom: 30px; }
        .section h2 { margin-bottom: 20px; font-size: 1.5em; color: #fff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 5px; color: #fff; font-size: 0.95em; margin-bottom: 10px; }
        input:focus, select:focus { outline: none; background: rgba(255, 255, 255, 0.1); border-color: #667eea; }
        .btn { padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 5px; color: #fff; cursor: pointer; font-weight: 600; transition: all 0.3s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .key-output { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 5px; padding: 15px; margin-top: 15px; word-break: break-all; font-family: 'Courier New', monospace; font-size: 0.9em; max-height: 300px; overflow-y: auto; display: none; }
        .message { padding: 12px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .message.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .message.error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🔑 KeyAuth Dashboard</h1>
        <a href="/logout">Logout</a>
    </div>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3>Total Keys</h3>
                <div class="number" id="totalKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Used Keys</h3>
                <div class="number" id="usedKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Available</h3>
                <div class="number" id="availableKeys">0</div>
            </div>
            <div class="stat-card">
                <h3>Banned</h3>
                <div class="number" id="bannedKeys">0</div>
            </div>
        </div>

        <div class="section">
            <h2>Generate New Keys</h2>
            <div class="message" id="message"></div>

            <div class="form-group">
                <label>Days Valid</label>
                <input type="number" id="daysValid" value="30" min="1" max="365">
            </div>

            <div class="form-group">
                <label>Max Uses</label>
                <input type="number" id="maxUses" value="1" min="1" max="10">
            </div>

            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="quantity" value="1" min="1" max="100">
            </div>

            <button class="btn" onclick="generateKeys()">Generate Keys</button>
            <button class="btn" onclick="copyAllKeys()" style="margin-left: 10px;">Copy All</button>

            <div class="key-output" id="keyOutput"></div>
        </div>
    </div>

    <script>
        async function generateKeys() {
            const days = document.getElementById('daysValid').value;
            const maxUses = document.getElementById('maxUses').value;
            const quantity = document.getElementById('quantity').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/generate-key', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({days_valid: days, max_uses: maxUses, quantity: quantity})
                });

                const data = await response.json();

                if (data.success) {
                    messageDiv.textContent = '✓ Keys generated!';
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';

                    let html = data.keys.map(k => `<div style="background: rgba(76,175,80,0.2); padding: 8px; margin: 5px 0; border-radius: 3px;">${k}</div>`).join('');
                    document.getElementById('keyOutput').innerHTML = html;
                    document.getElementById('keyOutput').style.display = 'block';

                    loadStats();
                } else {
                    messageDiv.textContent = '✗ ' + data.message;
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                messageDiv.textContent = '✗ Error: ' + error.message;
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('totalKeys').textContent = data.total;
                document.getElementById('usedKeys').textContent = data.used;
                document.getElementById('availableKeys').textContent = data.available;
                document.getElementById('bannedKeys').textContent = data.banned;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function copyAllKeys() {
            const output = document.getElementById('keyOutput').innerText;
            navigator.clipboard.writeText(output);
            alert('Copied to clipboard!');
        }

        loadStats();
    </script>
</body>
</html>
